<title>향수 이미지 미리보기</title>
<style>
:root{--paper:#F8F6F3;--ink:#231F3A;--slate:#5A556B;--hint:#9A95A8;--line:#E3DFE6;--card:#fff}

.meta{padding:10px 12px 12px;font-size:13px} .meta b{display:block;font-size:14px}
.meta span{color:var(--slate)} .tag{display:inline-block;margin-top:6px;font-size:11px;color:var(--hint);font-family:'IBM Plex Mono',monospace}
</style></head><body><main>
<h1>향수 이미지 미리보기</h1>
<p class="sub">이미지가 있는 향수는 그 이미지를, 없는 향수는 향 계열 색 대체 이미지를 보여줘요. (이미지 <span id="n1"></span>개 / 대체 <span id="n2"></span>개)</p>
<div class="bar" role="group" aria-label="보기 필터">
<button aria-pressed="true" data-f="all">전체</button><button aria-pressed="false" data-f="img">이미지 있음</button><button aria-pressed="false" data-f="ph">대체 이미지</button></div>

const grid=document.getElementById('grid');
function ph(f){return 'public/perfumes/placeholder/'+(TINT[f]?f:'default')+'.svg'}
function render(f){
  grid.innerHTML='';
  DATA.filter(d=>f==='all'||(f==='img'&&d.image)||(f==='ph'&&!d.image)).forEach(d=>{
    const c=document.createElement('article');c.className='card';
    const t=document.createElement('div');t.className='thumb';t.style.background=TINT[d.family]||'#F0EDF2';
    const i=document.createElement('img');i.loading='lazy';i.alt=d.image?(d.brand+' '+d.name+' 병 이미지'):'향수병 이미지 준비 중';
    i.src=d.image?('public/perfumes/'+d.image):ph(d.family);
    i.onerror=()=>{i.onerror=null;i.src=ph(d.family);i.alt='향수병 이미지 준비 중'};
    t.appendChild(i);
    const m=document.createElement('div');m.className='meta';
    m.innerHTML='<b></b><span></span><br><span class="tag"></span>';
    m.querySelector('b').textContent=d.name;m.querySelector('span').textContent=d.brand;
    m.querySelector('.tag').textContent=(d.image?'IMAGE':'PLACEHOLDER')+' · '+d.family;
    c.append(t,m);grid.appendChild(c);
  });
}
document.getElementById('n1').textContent=DATA.filter(d=>d.image).length;
document.getElementById('n2').textContent=DATA.filter(d=>!d.image).length;
document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bar button').forEach(x=>x.setAttribute('aria-pressed',x===b));render(b.dataset.f)});
render('all');
</script></body></html>
